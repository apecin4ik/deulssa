# Мир, в котором находится арена
world: grief-1

arena:
  # Центр арены. y = уровень, на котором стоят игроки (пол будет на 1 блок ниже).
  # Проще всего: встать на нужное место и написать /duel setcenter
  center:
    x: 0
    y: 100
    z: 0
  radius: 24   # минимум 20
  height: 14   # минимум 10

# Куда телепортировать после дуэли (/duel setspawn)
spawn:
  world: world
  x: 0.5
  y: 64.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

# Режим «Дуэль на RTP»: обоих игроков телепортирует в случайное место этого мира
rtp:
  world: grief-1
  center-x: 0
  center-z: 0
  min-distance: 300     # минимум от центра
  max-distance: 3000    # максимум от центра (учитывается границы мира)
  separation: 10        # расстояние между игроками при старте

# Приват арены. Никто не может ходить/ломать/ставить/телепортироваться в арену, кроме дуэлянтов.
protection:
  admin-bypass: false   # true — игроки с правом duel.admin тоже могут заходить в арену (для ремонта)

settings:
  open-duel-expire: 120      # через сколько секунд вызов пропадает
  teleport-countdown: 5      # таймер до телепорта на арену
  freeze-seconds: 0          # заморозка перед боем (0 = бить можно сразу после телепорта)
  loot-seconds: 20           # сколько победитель собирает дроп
  max-duel-seconds: 600      # лимит боя, потом ничья
  command-whitelist: []      # команды, разрешённые во время дуэли (без /)
  cancel-on-move: false      # отменять телепорт, если игрок двигался
  cancel-on-damage: false    # отменять телепорт, если игрок получил урон

